<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Aircraft Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>Live Aircraft Tracker</h2>
        <div class="controls">
            <label for="radius">Radius (km):</label>
            <input type="number" id="radius" value="100" min="10" max="500">
            <button id="update-btn">Update</button>
        </div>
        <div class="stats">
            <p>Total Aircraft: <span id="total-aircraft">0</span></p>
            <p>Last Update: <span id="last-update">Never</span></p>
        </div>
        <ul id="aircraft-list"></ul>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
