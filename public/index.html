<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Aircraft Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <h2>Live Aircraft Tracker</h2>
        <div class="location-controls">
            <div class="control-row" style="position: relative;">
                <label for="city-input">City:</label>
                <input type="text" id="city-input" placeholder="Search city..." autocomplete="off">
                <ul id="city-dropdown" class="dropdown-list" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; max-height: 150px; overflow-y: auto; display: none; z-index: 2000; list-style-type: none; padding: 0; margin: 0;"></ul>
            </div>
            <div class="control-row">
                <label for="lat-input">Lat:</label>
                <input type="number" id="lat-input" step="0.0001" style="width: 80px;">
                <label for="lon-input">Lon:</label>
                <input type="number" id="lon-input" step="0.0001" style="width: 80px;">
            </div>
            <div class="control-row">
                <label for="radius">Radius (km):</label>
                <input type="number" id="radius" value="100" min="10" max="500" style="width: 80px;">
                <button id="update-btn">Update</button>
            </div>
        </div>
        <div class="stats">
            <p>Total Aircraft: <span id="total-aircraft">0</span></p>
            <p>Last Update: <span id="last-update">Never</span></p>
        </div>
        <ul id="aircraft-list"></ul>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
